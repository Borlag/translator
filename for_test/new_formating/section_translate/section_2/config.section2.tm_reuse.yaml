llm:
  provider: openai
  model: gpt-5-mini
  source_lang: en
  target_lang: ru
  base_url: null
  system_prompt_path: ./general_prompt.md
  glossary_path: ./glossary.md
  glossary_in_prompt: true
  hard_glossary: false
  reasoning_effort: default
  prompt_cache_key: section2-tm-reuse-v1
  prompt_cache_retention: 24h
  structured_output_mode: "auto"
  temperature: 0.0
  max_output_tokens: 2400
  retries: 3
  timeout_s: 180.0
  glossary_prompt_mode: "matched"
  glossary_match_limit: 24
  batch_segments: 24
  batch_max_chars: 60000
  batch_skip_on_brline: true
  batch_max_style_tokens: 16
  context_window_chars: 0
  auto_model_sizing: false

tm:
  path: C:/Users/Urdul/Desktop/project/translator/translation_cache.sqlite
  fuzzy_enabled: false
  fuzzy_top_k: 3
  fuzzy_min_similarity: 0.75
  fuzzy_prompt_max_chars: 500
  fuzzy_rank_mode: "hybrid"

checker:
  enabled: false
  provider: openai
  model: gpt-5-mini
  temperature: 0.0
  max_output_tokens: 6000
  timeout_s: 120.0
  retries: 1
  system_prompt_path: null
  glossary_path: ./glossary.md
  pages_per_chunk: 3
  fallback_segments_per_chunk: 80
  max_segments: 0
  only_on_issue_severities: ["warn", "error"]
  only_on_issue_codes: []
  output_path: checker_suggestions.json
  safe_output_path: checker_suggestions_safe.json
  auto_apply_safe: false
  auto_apply_min_confidence: 0.82
  openai_batch_enabled: false
  openai_batch_completion_window: "24h"
  openai_batch_poll_interval_s: 20.0
  openai_batch_timeout_s: 86400.0

pricing:
  enabled: false
  pricing_path: null
  currency: USD

run:
  run_dir: ./run_tm_reuse
  run_id: null
  status_path: null
  dashboard_html_path: null
  status_flush_every_n_segments: 10
  batch_fallback_warn_ratio: 0.08
  batch_timeout_bisect: true
  fail_fast_on_translate_error: false

include_headers: false
include_footers: false

concurrency: 4
mode: reflow
abbyy_profile: "off"
glossary_lemma_check: "off"
untranslated_latin_warn_ratio: 0.15
untranslated_latin_min_len: 3
repeated_words_check: false
context_leakage_check: false
layout_check: false
layout_expansion_warn_ratio: 1.5
layout_auto_fix: false
layout_font_reduction_pt: 0.5
layout_spacing_factor: 0.8
font_shrink_body_pt: 0.0
font_shrink_table_pt: 0.0

qa_report_path: qa_report.html
qa_jsonl_path: qa.jsonl
translation_history_path: ./translation_history.tm_reuse.jsonl
log_path: C:/Users/Urdul/Desktop/project/translator/for_test/new_formating/section_translate/section_2/run_tm_reuse.log

patterns:
  preset_file: ../../../../config/regex_presets.yaml
  preset_name: default
